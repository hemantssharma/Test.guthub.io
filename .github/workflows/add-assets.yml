name: Add portfolio assets
on:
  push:
    branches: [main]
    paths-ignore:
      - "Hemant-Sharma-Resume.pdf"
      - "hemant-sharma-professional.jpg"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download resume and profile photo
        run: |
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/hemantssharma/hemantssharma.github.io/main/Hemant-Sharma-Resume.pdf" -o Hemant-Sharma-Resume.pdf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/hemantssharma/hemantssharma.github.io/main/hemant-sharma-professional.jpg" -o hemant-sharma-professional.jpg
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hemant-Sharma-Resume.pdf hemant-sharma-professional.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add portfolio resume and profile photo"
          git push